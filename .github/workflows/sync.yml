name: Sync YogaSix Calendar

on:
  schedule:
    # Hourly 5:00 AM - 9:00 PM MDT (11:00 - 03:00 UTC), plus midnight MDT (06:00 UTC)
    - cron: '0 11-23,0-3,6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Restore state file across workflow runs
      - name: Restore Event State Cache
        uses: actions/cache/restore@v4
        id: state-cache
        with:
          path: known_events.json
          key: event-state-${{ github.run_id }}
          restore-keys: |
            event-state-

      - name: Run API Sync
        run: python yogasix.py

      # Persist state file for subsequent runs
      - name: Save Event State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: known_events.json
          key: event-state-${{ github.run_id }}

      - name: Notify on Schedule Changes (Deduplicated)
        if: hashFiles('changes.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch open issue bodies
          OPEN_ISSUES=$(gh issue list --state open --limit 50 --json body -q '.[].body' || true)

          HAS_NEW_CHANGES=false
          while IFS= read -r line; do
            if [[ "$line" =~ ^-\ \*\*(MODIFIED|CANCELED):\*\* ]]; then
              # Use -e to prevent leading hyphens from being parsed as flags
              if echo "$OPEN_ISSUES" | grep -F -q -e "$line"; then
                echo "Skipping already alerted change: $line"
              else
                echo "Found un-notified change: $line"
                HAS_NEW_CHANGES=true
              fi
            fi
          done < changes.md

          if [ "$HAS_NEW_CHANGES" = true ]; then
            # Removed --assignee flag to resolve GitHub App token restriction
            gh issue create \
              --title "Schedule Change Detected: $(date -u +'%Y-%m-%d %H:%M UTC')" \
              --body-file changes.md
          else
            echo "All detected changes already exist in open issues. Skipping duplicate creation."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
